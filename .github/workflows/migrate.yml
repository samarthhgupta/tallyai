name: Run Database Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run migrations via Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, urllib.error, sys
          from pathlib import Path

          TOKEN = os.environ["SUPABASE_ACCESS_TOKEN"]
          PROJECT_REF = "idstdsuvxqzoankkfgde"
          BASE_URL = f"https://api.supabase.com/v1/projects/{PROJECT_REF}/database/query"

          def run_sql(sql):
              body = json.dumps({"query": sql}).encode()
              req = urllib.request.Request(
                  BASE_URL,
                  data=body,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req) as r:
                      return 200, r.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()

          # Ensure tracking table exists
          code, body = run_sql("""
              CREATE TABLE IF NOT EXISTS _migrations (
                  name TEXT PRIMARY KEY,
                  applied_at TIMESTAMPTZ DEFAULT NOW()
              );
          """)
          if code != 200:
              print(f"Failed to create tracking table: {body}")
              sys.exit(1)

          # Fetch already-applied migrations
          code, body = run_sql("SELECT name FROM _migrations ORDER BY name;")
          if code != 200:
              print(f"Failed to fetch applied migrations: {body}")
              sys.exit(1)

          applied = set()
          for row in json.loads(body):
              applied.add(row["name"])
          print(f"Already applied: {sorted(applied)}")

          # Run pending migrations in order
          migration_dir = Path("supabase/migrations")
          files = sorted(migration_dir.glob("*.sql"))
          any_failed = False

          for f in files:
              name = f.name
              if name in applied:
                  print(f"  ✓ skip  {name}")
                  continue

              print(f"  ▶ running {name} ...")
              sql = f.read_text(encoding="utf-8")
              code, body = run_sql(sql)
              if code != 200:
                  print(f"  ✗ FAILED {name}: {body}")
                  any_failed = True
                  break

              # Record as applied
              safe_name = name.replace("'", "''")
              code2, body2 = run_sql(f"INSERT INTO _migrations (name) VALUES ('{safe_name}') ON CONFLICT DO NOTHING;")
              if code2 != 200:
                  print(f"  ✗ Could not record {name}: {body2}")
                  any_failed = True
                  break

              print(f"  ✓ done   {name}")

          if any_failed:
              sys.exit(1)
          print("All migrations applied successfully.")
          PYEOF
